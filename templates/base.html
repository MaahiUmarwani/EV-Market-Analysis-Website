<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}EV Market Analysis{% endblock %} | Maahi Umarwani</title>
<meta name="description" content="Interactive Tableau dashboard and story on global electric vehicle market performance by Maahi Umarwani.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
{% block head %}{% endblock %}
</head>
<body>

<nav>
  <div class="wrap">
    <a class="logo" href="{{ url_for('home') }}"><span class="dot">⚡</span> EV Market Analysis</a>
    <button class="menu-btn" aria-label="Menu">☰</button>
    <div class="links">
      <a href="{{ url_for('home') }}" class="{{ 'active' if request.endpoint == 'home' }}">Home</a>
      <a href="{{ url_for('dashboard') }}" class="{{ 'active' if request.endpoint == 'dashboard' }}">Dashboard</a>
      <a href="{{ url_for('story') }}" class="{{ 'active' if request.endpoint == 'story' }}">Story</a>
      <a href="{{ url_for('home') }}#insights">Insights</a>
      <a href="{{ url_for('home') }}#about">About</a>
    </div>
  </div>
</nav>

{% block content %}{% endblock %}

<footer>
  <div class="wrap">
    <div>Built by <b>Maahi Umarwani</b> · EV Market Analysis · 2026</div>
    <div>
      <a href="https://public.tableau.com/app/profile/maahi.umarwani/vizzes" target="_blank" rel="noopener">Tableau Public</a>
      <a href="https://github.com/MaahiUmarwani/EV-Market-Analysis-Website" target="_blank" rel="noopener">GitHub</a>
    </div>
  </div>
</footer>

<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
